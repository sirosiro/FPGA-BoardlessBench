<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <!-- PCB Blue Gradient -->
    <linearGradient id="bluePcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#104eae"/>
      <stop offset="100%" stop-color="#082860"/>
    </linearGradient>

    <!-- Screw Metallic Pad Gradient -->
    <radialGradient id="screwGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6e6e6"/>
      <stop offset="40%" stop-color="#b0b0b0"/>
      <stop offset="75%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#404040"/>
    </radialGradient>

    <!-- Gold Header Pin Pad Gradient -->
    <radialGradient id="goldPadGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="35%" stop-color="#ffd040"/>
      <stop offset="85%" stop-color="#a27500"/>
      <stop offset="100%" stop-color="#543c00"/>
    </radialGradient>

    <!-- Flex Ribbon Cable Metallic Gold Gradient -->
    <linearGradient id="flexRibbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b88300"/>
      <stop offset="25%" stop-color="#f0b400"/>
      <stop offset="50%" stop-color="#ffd23d"/>
      <stop offset="75%" stop-color="#f0b400"/>
      <stop offset="100%" stop-color="#b88300"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Bezel -->
    <filter id="bezelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. PCB Blue Board Body -->
  <rect x="4" y="4" width="272" height="272" rx="14" fill="url(#bluePcbGrad)" stroke="#183e78" stroke-width="2"/>

  <!-- 2. Four Corner Mounting Screw Holes -->
  <!-- Top-Left -->
  <circle cx="21" cy="21" r="12" fill="url(#screwGrad)" stroke="#222222" stroke-width="1"/>
  <circle cx="21" cy="21" r="7" fill="#0d1117"/>
  <!-- Top-Right -->
  <circle cx="259" cy="21" r="12" fill="url(#screwGrad)" stroke="#222222" stroke-width="1"/>
  <circle cx="259" cy="21" r="7" fill="#0d1117"/>
  <!-- Bottom-Left -->
  <circle cx="21" cy="259" r="12" fill="url(#screwGrad)" stroke="#222222" stroke-width="1"/>
  <circle cx="21" cy="259" r="7" fill="#0d1117"/>
  <!-- Bottom-Right -->
  <circle cx="259" cy="259" r="12" fill="url(#screwGrad)" stroke="#222222" stroke-width="1"/>
  <circle cx="259" cy="259" r="7" fill="#0d1117"/>

  <!-- 3. Top I2C Header Pin Pads (Gold Terminals) -->
  <circle cx="106" cy="14" r="4.5" fill="url(#goldPadGrad)" stroke="#111111" stroke-width="0.8"/>
  <circle cx="128" cy="14" r="4.5" fill="url(#goldPadGrad)" stroke="#111111" stroke-width="0.8"/>
  <circle cx="150" cy="14" r="4.5" fill="url(#goldPadGrad)" stroke="#111111" stroke-width="0.8"/>
  <circle cx="172" cy="14" r="4.5" fill="url(#goldPadGrad)" stroke="#111111" stroke-width="0.8"/>

  <!-- 4. Top White Silk Screen Labels -->
  <text x="106" y="27" font-family="monospace, 'Courier New', sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" opacity="0.95" text-anchor="middle">GND</text>
  <text x="128" y="27" font-family="monospace, 'Courier New', sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" opacity="0.95" text-anchor="middle">VCC</text>
  <text x="150" y="27" font-family="monospace, 'Courier New', sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" opacity="0.95" text-anchor="middle">SCL</text>
  <text x="172" y="27" font-family="monospace, 'Courier New', sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" opacity="0.95" text-anchor="middle">SDA</text>

  <!-- 5. Display Glass Bezel Outer Black Frame -->
  <rect x="14" y="36" width="252" height="144" rx="5" fill="#14171a" stroke="#07080a" stroke-width="2" filter="url(#bezelShadow)"/>

  <!-- 6. Active Matrix Display Window Area (128x64 Target Target Canvas Alignment) -->
  <rect x="23" y="47" width="234" height="122" rx="3" fill="#040604" stroke="#111111" stroke-width="1.5"/>

  <!-- 7. Bottom Ribbon Flex Connector Block -->
  <rect x="105" y="196" width="70" height="26" rx="3" fill="#111622" stroke="#232e42" stroke-width="1.5"/>
  <rect x="113" y="202" width="54" height="17" rx="1.5" fill="url(#flexRibbonGrad)" stroke="#7a5500" stroke-width="1"/>
</svg>
