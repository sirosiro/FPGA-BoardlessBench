<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" width="100%" height="100%">
  <defs>
    <!-- PCB Dark Gradient -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252c" />
      <stop offset="50%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#121317" />
    </linearGradient>
    
    <!-- Display Filter Bezel -->
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0304" />
      <stop offset="100%" stop-color="#140608" />
    </linearGradient>

    <!-- Gold Pin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="1" dy="2"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="black" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- PCB Body -->
  <rect x="10" y="10" width="480" height="250" rx="16" ry="16" fill="url(#pcbGrad)" stroke="#383d4a" stroke-width="2" />
  
  <!-- PCB Corner Mounting Holes -->
  <circle cx="28" cy="28" r="10" fill="#0b0c0e" stroke="#484e5e" stroke-width="2" />
  <circle cx="472" cy="28" r="10" fill="#0b0c0e" stroke="#484e5e" stroke-width="2" />
  <circle cx="28" cy="242" r="10" fill="#0b0c0e" stroke="#484e5e" stroke-width="2" />
  <circle cx="472" cy="242" r="10" fill="#0b0c0e" stroke="#484e5e" stroke-width="2" />

  <!-- Gold Header Pads & Labels (Bottom Left) -->
  <g transform="translate(40, 210)">
    <!-- CLK -->
    <rect x="0" y="0" width="18" height="30" rx="3" fill="url(#goldGrad)" stroke="#664d00" stroke-width="1"/>
    <circle cx="9" cy="15" r="5" fill="#0d0e11"/>
    <text x="9" y="-6" fill="#a0a8ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CLK</text>

    <!-- DAT -->
    <rect x="30" y="0" width="18" height="30" rx="3" fill="url(#goldGrad)" stroke="#664d00" stroke-width="1"/>
    <circle cx="39" cy="15" r="5" fill="#0d0e11"/>
    <text x="39" y="-6" fill="#a0a8ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">DAT</text>

    <!-- VCC -->
    <rect x="60" y="0" width="18" height="30" rx="3" fill="url(#goldGrad)" stroke="#664d00" stroke-width="1"/>
    <circle cx="69" cy="15" r="5" fill="#0d0e11"/>
    <text x="69" y="-6" fill="#a0a8ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">VCC</text>

    <!-- GND -->
    <rect x="90" y="0" width="18" height="30" rx="3" fill="url(#goldGrad)" stroke="#664d00" stroke-width="1"/>
    <circle cx="99" cy="15" r="5" fill="#0d0e11"/>
    <text x="99" y="-6" fill="#a0a8ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">GND</text>
  </g>

  <!-- Silkscreen Logos & Labels -->
  <text x="250" y="32" fill="#788296" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" text-anchor="middle">adafruit 0.56" 4-DIGIT 7-SEGMENT HT16K33 BACKPACK</text>
  <text x="430" y="240" fill="#4d5566" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end">PPA 2.0 OFFICIAL PLUGIN</text>

  <!-- 7-Segment LED Display Module Frame Cutout / Bezel -->
  <rect x="40" y="45" width="420" height="150" rx="8" fill="url(#filterGrad)" stroke="#3a0d14" stroke-width="2" filter="url(#innerShadow)" />
</svg>
