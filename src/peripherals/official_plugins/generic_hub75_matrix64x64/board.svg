<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- Main Dark PCB Board Base (480x360) -->
  <rect width="480" height="360" rx="14" fill="#070b12" stroke="#1e293b" stroke-width="3"/>
  
  <!-- PCB Corner Mounting Holes -->
  <circle cx="18" cy="18" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="462" cy="18" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="18" cy="342" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="462" cy="342" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Power Terminal (5V / GND) -->
  <rect x="20" y="25" width="55" height="32" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="3"/>
  <text x="47" y="18" fill="#ef4444" font-size="8" font-family="monospace" text-anchor="middle" font-weight="bold">+5V GND</text>
  <circle cx="34" cy="41" r="5" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
  <circle cx="59" cy="41" r="5" fill="#64748b" stroke="#334155" stroke-width="1"/>

  <!-- HUB75 Connector Pin Header (16-pin) -->
  <rect x="20" y="130" width="30" height="95" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="3"/>
  <text x="35" y="119" fill="#94a3b8" font-size="8" font-family="sans-serif" text-anchor="middle" font-weight="bold">HUB75E</text>
  <!-- Pins 1..16 -->
  <circle cx="27" cy="141" r="2" fill="#f59e0b"/><circle cx="43" cy="141" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="153" r="2" fill="#f59e0b"/><circle cx="43" cy="153" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="165" r="2" fill="#f59e0b"/><circle cx="43" cy="165" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="177" r="2" fill="#f59e0b"/><circle cx="43" cy="177" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="189" r="2" fill="#f59e0b"/><circle cx="43" cy="189" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="201" r="2" fill="#f59e0b"/><circle cx="43" cy="201" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="213" r="2" fill="#f59e0b"/><circle cx="43" cy="213" r="2" fill="#f59e0b"/>

  <!-- IC Shift Register Chips (SMD) -->
  <rect x="68" y="80" width="18" height="38" fill="#1e293b" stroke="#334155" stroke-width="1" rx="1.5"/>
  <text x="77" y="101" fill="#64748b" font-size="5" font-family="monospace" text-anchor="middle">74HC595</text>

  <rect x="68" y="245" width="18" height="38" fill="#1e293b" stroke="#334155" stroke-width="1" rx="1.5"/>
  <text x="77" y="266" fill="#64748b" font-size="5" font-family="monospace" text-anchor="middle">FM6124</text>

  <!-- PCB Inner Bezel / Screen Frame Window (320x320) -->
  <rect x="116" y="20" width="320" height="320" fill="#020408" stroke="#475569" stroke-width="2" rx="6"/>
</svg>
